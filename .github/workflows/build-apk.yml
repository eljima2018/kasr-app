name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            f=$(find . -name index.html -not -path "./node_modules/*" -not -path "./android/*" -not -path "./www/*" | head -n 1)
            if [ -z "$f" ]; then
              echo "index.html NOT FOUND. Files in repo:"
              find . -type f -not -path "./.git/*"
              exit 1
            fi
            cp "$f" www/index.html
          fi
          ls -la www

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Install ImageMagick
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Make app icon
        continue-on-error: true
        run: |
          if command -v magick >/dev/null 2>&1; then IM="magick"; else IM="convert"; fi
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for s in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${s%%:*}; p=${s##*:}
            $IM -size 192x192 xc:'#3949ab' -fill white -draw "circle 96,96 96,24" -fill '#ffa726' -draw "path 'M 96,96 L 96,24 A 72,72 0 0,1 168,96 Z'" -fill '#66bb6a' -draw "path 'M 96,96 L 168,96 A 72,72 0 0,1 96,168 Z'" -resize ${p}x${p} $R/mipmap-$d/ic_launcher.png
            cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_round.png
          done

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kasr-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kasr build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
